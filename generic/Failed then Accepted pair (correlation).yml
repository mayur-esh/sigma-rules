title: sshd Failed Then Accepted Password Pair Within Two Minutes (sshole Pattern)
id: 9c4e1f72-2d3a-4b69-9f1b-6c7d8e9f0a13
status: experimental
description: |
  Lab reports state a stock Alpine bypass logs a Failed password immediately followed by an Accepted
  password for the same user and source port. Correlates two or more sshd password events from one
  source to one user within the LoginGraceTime default of 120 seconds.
references:
  - https://www.spectrum.security/blog/can-i-detect-sshole
  - https://dev.to/frankchu/300-chars-opened-a-locked-musl-account-on-try-2-25ni
author: Mayuresh Dani
date: 2026-11-06
correlation:
  type: event_count
  rules:
    - 7a2d9e41-1c3b-4f58-8e0a-5b6c7d8e9f02
  group-by:
    - src_ip
    - user
  timespan: 2m
  condition:
    gte: 2
falsepositives:
  - Users who mistype a password once
level: medium
