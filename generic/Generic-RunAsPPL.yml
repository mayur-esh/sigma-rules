# =============================================================================
# Sigma detection rule - "Chaotic Eclipse" / MSNightmare 0day PoCs (Windows 11 25H2)
# =============================================================================
title: Defense Tamper - LSA Protection (RunAsPPL) Disabled
id: ba55d887-49e6-4fe9-9cda-154544acb58d
status: experimental
description: Detects the RunAsPPL value being set to 0, which disables LSA Protection - a likely precursor step to broaden credential theft after any of these EoP chains.
references:
  - https://learn.microsoft.com/en-us/windows-server/security/credentials-protection-and-management/configuring-additional-lsa-protection
author: Mayuresh Dani
date: 2026-08-30
tags:
  - attack.defense-evasion
  - attack.t1562.001
  - attack.t1112
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|endswith: '\Control\Lsa\RunAsPPL'
    Details: 'DWORD (0x00000000)'
  condition: selection
falsepositives:
  - Sanctioned rollback by administrators
level: high
