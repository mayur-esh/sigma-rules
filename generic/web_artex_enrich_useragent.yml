title: ARTEX Family Enrichment User-Agent in Web Server Logs
id: b5fd059c-13e2-49de-8337-57badedd4b08
status: experimental
description: |
    Detects inbound requests carrying the enrichment user-agent of ARTEX-family agents.
    The enrichment engine in ARTEX (enrich/enrich.go) fetches a site with the user-agent
    "artex-enrich/1.0". The Pojun fork renamed it "pojun-enrich/1.0" and AntiFox, an ARTEX copy
    under another name, "antifox-enrich/1.0". No shipped code in the public ARTEX-family
    histories calls the function that sends this request, yet WorkOS reported seeing
    artex-enrich/1.0 in its October 2026 incident, so a hit points to a build that differs
    from the public code. The second selection catches further renames that keep the
    "<name>-enrich/1.0" form.
references:
    - https://labs.cloudsecurityalliance.org/research/csa-research-note-workos-artex-scope-escape-20261108-csa-sty/
    - https://pentestit.com/ai-pentesting-frameworks-abuse-lineage-fingerprints/
author: Mayuresh Dani
date: 2026-11-14
tags:
    - attack.reconnaissance
    - attack.t1595
logsource:
    category: webserver
detection:
    selection_known:
        cs-user-agent:
            - 'artex-enrich/1.0'
            - 'pojun-enrich/1.0'
            - 'antifox-enrich/1.0'
    selection_renamed:
        cs-user-agent|re: '^[a-z0-9]+-enrich/1\.0$'
    condition: 1 of selection_*
falsepositives:
    - Authorized red team or research use of ARTEX or one of its forks
    - Unrelated software whose user-agent happens to take the form <name>-enrich/1.0 (second selection only)
level: medium
