title: OpenSSH Password Login to Account With No Password (sshole CVE-2026-123158)
id: 3f1c2b8e-6d4a-4c1e-9a77-0b5d2e9c1a01
status: experimental
description: |
  Detects an sshd "Accepted password" event for an account whose /etc/shadow password field is "*".
  On musl libc builds of OpenSSH before 10.6p2 running without PAM, such an account accepts any
  password of 257 to 1024 bytes. Populate the username list per host from:
  awk -F: '$2=="*"{print $1}' /etc/shadow
references:
  - https://alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/
  - https://www.openssh.com/txt/release-10.6p2
  - https://sshhole.com/
author: Mayuresh Dani
date: 2026-11-06
tags:
  - attack.initial-access
  - attack.t1190
  - attack.t1078.003
  - cve.2026-123158
logsource:
  product: linux
  service: auth
detection:
  selection_event:
    - 'Accepted password for root '
    - 'Accepted password for alpine '
  condition: selection_event
falsepositives:
  - None expected for accounts whose shadow field is "*"; replace the example names with your per-host list
level: critical
