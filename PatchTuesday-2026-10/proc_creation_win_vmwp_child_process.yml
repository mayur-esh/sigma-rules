# =============================================================================
# Sigma detection rule - Microsoft Patch Tuesday, October 2026
# =============================================================================
title: Hyper-V Worker Process Spawns A Child Process
id: 49fa4ed7-36ce-48f8-ac9a-f8abb04062f9
status: experimental
description: |
    Detects vmwp.exe starting any process other than Windows Error Reporting. The worker process
    hosts a guest VM; code running in its context is the outcome of a guest-to-host escape such as
    CVE-2026-105733 (Hyper-V RCE, Exploitation More Likely).
references:
    - https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-105733
author: Mayuresh Dani
date: 2026-10-13
tags:
    - attack.privilege-escalation
    - attack.t1611
    - cve.2026-105733
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith: '\vmwp.exe'
    filter_main_werfault:
        Image|endswith: '\WerFault.exe'
    condition: selection and not 1 of filter_main_*
falsepositives:
    - Unknown
level: high
